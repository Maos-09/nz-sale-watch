<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Sale Watch</title>
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#06131c">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              950: '#06131c',
              900: '#0b1f2d',
              800: '#132f45',
              700: '#1d4463',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-ocean-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-ocean-950">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-ocean-900/90 backdrop-blur-md border-b border-ocean-700/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-teal-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="tag" class="w-6 h-6 text-ocean-950 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            NZ Sale Watch <span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-medium border border-cyan-500/30">Live</span>
          </h1>
          <p id="lastUpdatedText" class="text-xs text-slate-400">Ready</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- Manual Refresh Button -->
        <button onclick="fetchLiveDeals(true)" title="Sync Deals" class="p-2 rounded-xl bg-ocean-800/80 hover:bg-ocean-700 text-cyan-300 hover:text-white transition border border-ocean-700/50">
          <i id="refreshIcon" data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>

        <!-- Notification Bell -->
        <div class="relative">
          <button onclick="toggleNotifications()" class="relative p-2 rounded-xl bg-ocean-800/80 hover:bg-ocean-700 text-slate-300 hover:text-white transition border border-ocean-700/50">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="notifBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-cyan-500 text-ocean-950 text-xs font-bold rounded-full flex items-center justify-center shadow-md hidden">0</span>
          </button>

          <!-- Notification Drawer -->
          <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-80 sm:w-96 bg-ocean-900 border border-ocean-700 rounded-2xl shadow-2xl p-4 z-50">
            <div class="flex items-center justify-between pb-3 border-b border-ocean-800">
              <h3 class="font-semibold text-white text-sm flex items-center gap-2">
                <i data-lucide="bell-ring" class="w-4 h-4 text-cyan-400"></i> Sale Alerts
              </h3>
              <button onclick="clearNotifications()" class="text-xs text-slate-400 hover:text-cyan-300 transition">Clear all</button>
            </div>
            <div id="notifList" class="divide-y divide-ocean-800/60 max-h-80 overflow-y-auto mt-2 space-y-2">
              <div class="py-6 text-center text-sm text-slate-400">No sale alerts yet</div>
            </div>
          </div>
        </div>

        <button onclick="openModal()" class="flex items-center space-x-2 bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-ocean-950 font-semibold px-3.5 sm:px-4 py-2 rounded-xl shadow-lg shadow-cyan-500/20 transition transform active:scale-95">
          <i data-lucide="plus" class="w-5 h-5 stroke-[2.5]"></i>
          <span class="hidden sm:inline">Watch Item</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Stats & Filters Bar -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Watched Items</p>
          <h3 id="statTotal" class="text-2xl font-bold text-white mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
          <i data-lucide="package" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Currently on Sale</p>
          <h3 id="statOnSale" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="tag" class="w-6 h-6"></i>
        </div>
      </div>

      <!-- Filters -->
      <div class="md:col-span-2 bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400 font-medium">Status:</span>
          <select id="statusFilter" onchange="renderItems()" class="bg-ocean-800 border border-ocean-700 text-xs text-slate-200 rounded-xl px-3 py-2 outline-none focus:border-cyan-500">
            <option value="all">All Statuses</option>
            <option value="sale">On Sale Now</option>
            <option value="tracking">Watching</option>
          </select>
        </div>

        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400 font-medium">Region:</span>
          <select id="regionFilter" onchange="renderItems()" class="bg-ocean-800 border border-ocean-700 text-xs text-slate-200 rounded-xl px-3 py-2 outline-none focus:border-cyan-500">
            <option value="all">All Regions</option>
            <option value="nz">NZ Only</option>
            <option value="overseas">Overseas</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Items Grid -->
    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically populated -->
    </div>

  </main>

  <!-- Watch New Item Modal -->
  <div id="itemModal" class="hidden fixed inset-0 z-50 bg-ocean-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-ocean-900 border border-ocean-700 rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-ocean-800 mb-5">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="tag" class="w-5 h-5 text-cyan-400"></i> Watch New Item
        </h2>
        <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white rounded-xl bg-ocean-800/50 hover:bg-ocean-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="watchForm" onsubmit="handleWatchItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Item Name <span class="text-cyan-400">*Required</span></label>
          <input type="text" id="newItemName" required placeholder="e.g. Sony WH-1000XM5, iPhone 15" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Target Price ($) <span class="text-slate-500 font-normal">Optional</span></label>
            <input type="number" step="0.01" id="newItemTarget" placeholder="e.g. 450" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Region</label>
            <select id="newItemRegion" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="nz">New Zealand</option>
              <option value="overseas">Overseas</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-ocean-800">
          <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-ocean-800 hover:bg-ocean-700 text-slate-300 text-sm font-semibold transition">Cancel</button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-ocean-950 text-sm font-bold shadow-lg shadow-cyan-500/20 transition">Add to Watchlist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    let items = [];
    let notifications = JSON.parse(localStorage.getItem('nz_sale_watch_notifs')) || [];
    let seenDeals = JSON.parse(localStorage.getItem('nz_sale_watch_seen_deals')) || {};

    function init() {
      lucide.createIcons();
      updateNotificationsUI();
      
      // Load local watchlist instantly so app opens with zero delay
      const localItems = JSON.parse(localStorage.getItem('nz_sale_watch_local_watchlist')) || [];
      items = localItems;
      renderItems();

      // Fetch cloud updates silently in the background
      fetchLiveDeals(false);
    }

    async function fetchLiveDeals(isManual = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      const statusText = document.getElementById('lastUpdatedText');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');
      if (isManual) statusText.innerText = 'Syncing...';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(`deals.json?t=${Date.now()}`, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('deals.json unavailable');
        
        const liveData = await response.json();
        const localItems = JSON.parse(localStorage.getItem('nz_sale_watch_local_watchlist')) || [];
        
        const map = new Map();
        [...liveData, ...localItems].forEach(item => map.set(item.name.toLowerCase(), item));
        items = Array.from(map.values());

        items.forEach(item => {
          if (item.storesOnSale && item.storesOnSale.length > 0) {
            const best = item.storesOnSale.reduce((prev, curr) => prev.price < curr.price ? prev : curr);
            const dealSignature = `${item.name}-${best.name}-${best.price}`;

            if (!seenDeals[dealSignature]) {
              seenDeals[dealSignature] = true;
              addNotification(
                item.name,
                `On sale for $${best.price.toFixed(2)} NZD at ${best.name}!`
              );
            }
          }
        });

        localStorage.setItem('nz_sale_watch_seen_deals', JSON.stringify(seenDeals));
        localStorage.setItem('nz_sale_watch_notifs', JSON.stringify(notifications));
        
        statusText.innerText = 'Cloud synced';
        renderItems();
        updateNotificationsUI();
      } catch (err) {
        console.warn('Using local cache:', err);
        statusText.innerText = 'Local mode';
      } finally {
        if (refreshIcon) {
          setTimeout(() => refreshIcon.classList.remove('animate-spin'), 400);
        }
      }
    }

    function openModal() {
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('watchForm').reset();
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function handleWatchItem(e) {
      e.preventDefault();
      const name = document.getElementById('newItemName').value.trim();
      const targetVal = document.getElementById('newItemTarget').value;
      const targetPrice = targetVal ? parseFloat(targetVal) : null;
      const region = document.getElementById('newItemRegion').value;

      let localItems = JSON.parse(localStorage.getItem('nz_sale_watch_local_watchlist')) || [];
      
      if (!localItems.some(i => i.name.toLowerCase() === name.toLowerCase())) {
        localItems.push({
          name,
          target_price: targetPrice,
          region,
          storesOnSale: []
        });
        localStorage.setItem('nz_sale_watch_local_watchlist', JSON.stringify(localItems));
      }

      closeModal();
      items = localItems;
      renderItems();
      fetchLiveDeals(true);
    }

    function deleteItem(name) {
      if (confirm(`Stop watching "${name}"?`)) {
        let localItems = JSON.parse(localStorage.getItem('nz_sale_watch_local_watchlist')) || [];
        localItems = localItems.filter(i => i.name.toLowerCase() !== name.toLowerCase());
        localStorage.setItem('nz_sale_watch_local_watchlist', JSON.stringify(localItems));
        items = localItems;
        renderItems();
      }
    }

    function addNotification(itemName, message) {
      notifications.unshift({
        id: Date.now() + Math.random(),
        itemName,
        message,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        read: false
      });
      if (notifications.length > 25) notifications.pop();
    }

    function toggleNotifications() {
      document.getElementById('notifDropdown').classList.toggle('hidden');
    }

    function clearNotifications() {
      notifications = [];
      localStorage.setItem('nz_sale_watch_notifs', JSON.stringify(notifications));
      updateNotificationsUI();
    }

    function handleNotificationClick(notifId) {
      const notif = notifications.find(n => n.id === notifId);
      if (notif) {
        notif.read = true;
        localStorage.setItem('nz_sale_watch_notifs', JSON.stringify(notifications));
        updateNotificationsUI();
        toggleNotifications();
        
        const cards = document.querySelectorAll('.item-card');
        cards.forEach(card => {
          if (card.dataset.name === notif.itemName) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('ring-2', 'ring-cyan-400', 'bg-ocean-800/90');
            setTimeout(() => {
              card.classList.remove('ring-2', 'ring-cyan-400', 'bg-ocean-800/90');
            }, 2500);
          }
        });
      }
    }

    function updateNotificationsUI() {
      const badge = document.getElementById('notifBadge');
      const list = document.getElementById('notifList');
      const unreadCount = notifications.filter(n => !n.read).length;

      if (unreadCount > 0) {
        badge.innerText = unreadCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (notifications.length === 0) {
        list.innerHTML = `<div class="py-6 text-center text-sm text-slate-400">No sale alerts yet</div>`;
        return;
      }

      list.innerHTML = notifications.map(n => `
        <div onclick="handleNotificationClick(${n.id})" class="p-3 hover:bg-ocean-800/50 rounded-xl cursor-pointer transition ${n.read ? 'opacity-60' : 'bg-ocean-800/30 border border-cyan-500/20'}">
          <div class="flex items-start justify-between gap-2">
            <p class="text-xs font-semibold text-white">${n.itemName}</p>
            <span class="text-[10px] text-slate-400">${n.time}</span>
          </div>
          <p class="text-xs text-slate-300 mt-1">${n.message}</p>
        </div>
      `).join('');
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      const statusFilter = document.getElementById('statusFilter').value;
      const regionFilter = document.getElementById('regionFilter').value;

      document.getElementById('statTotal').innerText = items.length;
      const onSaleCount = items.filter(i => i.storesOnSale && i.storesOnSale.length > 0).length;
      document.getElementById('statOnSale').innerText = onSaleCount;

      const filtered = items.filter((item) => {
        const hasSale = item.storesOnSale && item.storesOnSale.length > 0;
        if (statusFilter === 'sale' && !hasSale) return false;
        if (statusFilter === 'tracking' && hasSale) return false;
        if (regionFilter === 'nz' && item.region !== 'nz') return false;
        if (regionFilter === 'overseas' && item.region !== 'overseas') return false;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center bg-ocean-900/30 border border-ocean-800/60 rounded-3xl">
            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mx-auto mb-4">
              <i data-lucide="package-open" class="w-8 h-8"></i>
            </div>
            <h3 class="text-base font-semibold text-white">No items watched yet</h3>
            <p class="text-xs text-slate-400 mt-1">Click "Watch Item" above to start tracking products instantly.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map((item) => {
        const hasSale = item.storesOnSale && item.storesOnSale.length > 0;
        const sortedStores = hasSale ? [...item.storesOnSale].sort((a, b) => a.price - b.price) : [];

        const mediaHtml = item.image 
          ? `<img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-2xl object-contain bg-white p-1.5 border border-ocean-700 shrink-0">`
          : `<div class="w-16 h-16 rounded-2xl bg-ocean-800 border border-ocean-700 flex items-center justify-center text-cyan-400 shrink-0"><i data-lucide="tag" class="w-7 h-7"></i></div>`;

        let salesListHtml = '';
        if (hasSale) {
          salesListHtml = `
            <div class="mt-4 pt-4 border-t border-ocean-800/80 space-y-2">
              <p class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> On Sale at ${sortedStores.length} Store${sortedStores.length > 1 ? 's' : ''}:
              </p>
              <div class="space-y-2">
                ${sortedStores.map((s, idx) => `
                  <div class="flex items-center justify-between bg-ocean-950/70 p-2.5 rounded-xl border ${idx === 0 ? 'border-emerald-500/40' : 'border-ocean-800/80'}">
                    <div class="pr-2">
                      <div class="flex items-center gap-1.5">
                        <span class="text-xs font-semibold text-white">${s.name}</span>
                        ${idx === 0 ? '<span class="text-[9px] font-bold uppercase px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300">Best</span>' : ''}
                      </div>
                      <span class="text-sm font-bold text-emerald-400">$${s.price.toFixed(2)} NZD</span>
                    </div>
                    <a href="${s.link}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 bg-emerald-500 hover:bg-emerald-400 text-ocean-950 font-bold px-3 py-2 rounded-lg text-xs shadow-md shadow-emerald-500/20 transition shrink-0">
                      <span>View Sale</span>
                      <i data-lucide="external-link" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                    </a>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          salesListHtml = `
            <div class="mt-4 pt-4 border-t border-ocean-800/80">
              <div class="flex items-center justify-between text-xs text-slate-400">
                <span>Status</span>
                <span class="text-cyan-300 font-medium flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Watching for sales...
                </span>
              </div>
            </div>
          `;
        }

        const overseasBadge = item.region === 'overseas' 
          ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 flex items-center gap-1"><i data-lucide="globe" class="w-3 h-3"></i> Overseas</span>`
          : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-ocean-800 text-slate-300 border border-ocean-700/60">NZ Stores</span>`;

        return `
          <div class="item-card bg-ocean-900/60 border ${hasSale ? 'border-emerald-500/30' : 'border-ocean-800'} rounded-3xl p-5 shadow-xl flex flex-col justify-between transition" data-name="${item.name}">
            <div>
              <div class="flex items-start justify-between gap-3 mb-3">
                <div class="flex items-center space-x-3.5 min-w-0 flex-1">
                  ${mediaHtml}
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5 flex-wrap mb-1">
                      ${overseasBadge}
                      ${item.target_price ? `<span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-ocean-800 text-cyan-300">Target: $${item.target_price.toFixed(2)}</span>` : ''}
                    </div>
                    <h3 class="font-bold text-white text-base leading-snug break-words">${item.name}</h3>
                  </div>
                </div>
                <button onclick="deleteItem('${item.name.replace(/'/g, "\\'")}')" title="Stop Watching" class="p-2 text-rose-400 hover:text-rose-300 rounded-xl bg-ocean-800/50 hover:bg-ocean-800 transition shrink-0">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>

              ${salesListHtml}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.onload = init;
  </script>
</body>
</html>
