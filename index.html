<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Sale Watch</title>
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#06131c">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              950: '#06131c',
              900: '#0b1f2d',
              800: '#132f45',
              700: '#1d4463',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-ocean-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-ocean-950">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-ocean-900/90 backdrop-blur-md border-b border-ocean-700/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-teal-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="tag" class="w-6 h-6 text-ocean-950 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            NZ Sale Watch <span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-medium border border-cyan-500/30">Live NZ</span>
          </h1>
          <p class="text-xs text-slate-400">Real-time New Zealand store scanner</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="openModal()" class="flex items-center space-x-2 bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-ocean-950 font-semibold px-4 py-2 rounded-xl shadow-lg shadow-cyan-500/20 transition transform active:scale-95">
          <i data-lucide="plus" class="w-5 h-5 stroke-[2.5]"></i>
          <span>Watch Item</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Stats & Filters Bar -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Watched Items</p>
          <h3 id="statTotal" class="text-2xl font-bold text-white mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
          <i data-lucide="package" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Currently on Sale</p>
          <h3 id="statOnSale" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="tag" class="w-6 h-6"></i>
        </div>
      </div>

      <!-- Filter -->
      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <span class="text-xs text-slate-400 font-medium">Filter Status:</span>
        <select id="statusFilter" onchange="renderItems()" class="bg-ocean-800 border border-ocean-700 text-xs text-slate-200 rounded-xl px-3 py-2 outline-none focus:border-cyan-500">
          <option value="all">All Statuses</option>
          <option value="sale">On Sale Now</option>
          <option value="tracking">Watching</option>
        </select>
      </div>
    </div>

    <!-- Items Grid -->
    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically populated -->
    </div>

  </main>

  <!-- Watch New Item Modal -->
  <div id="itemModal" class="hidden fixed inset-0 z-50 bg-ocean-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-ocean-900 border border-ocean-700 rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-ocean-800 mb-5">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="tag" class="w-5 h-5 text-cyan-400"></i> Watch New Item (NZ Live)
        </h2>
        <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white rounded-xl bg-ocean-800/50 hover:bg-ocean-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="watchForm" onsubmit="handleWatchItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Item Name <span class="text-cyan-400">*Required</span></label>
          <input type="text" id="newItemName" required placeholder="e.g. Sony WH-1000XM5, iPhone 15" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
          <p class="text-[11px] text-slate-400 mt-1">Scans live New Zealand stores automatically.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Target Price ($ NZD) <span class="text-slate-500 font-normal">Optional</span></label>
          <input type="number" step="0.01" id="newItemTarget" placeholder="e.g. 450" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-ocean-800">
          <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-ocean-800 hover:bg-ocean-700 text-slate-300 text-sm font-semibold transition">Cancel</button>
          <button type="submit" id="submitBtn" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-ocean-950 text-sm font-bold shadow-lg shadow-cyan-500/20 transition">Fetch Live Prices</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // PASTE YOUR FREE SERPAPI KEY HERE:
    const SERPAPI_KEY = 'YOUR_SERPAPI_KEY_HERE';

    let items = JSON.parse(localStorage.getItem('nz_sale_watch_live_v3')) || [];

    function init() {
      lucide.createIcons();
      renderItems();
    }

    function saveToStorage() {
      localStorage.setItem('nz_sale_watch_live_v3', JSON.stringify(items));
      renderItems();
    }

    function openModal() {
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('watchForm').reset();
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    // Fetch real live NZ store prices via SerpApi Google Shopping NZ
    async function handleWatchItem(e) {
      e.preventDefault();
      const name = document.getElementById('newItemName').value.trim();
      const targetVal = document.getElementById('newItemTarget').value;
      const targetPrice = targetVal ? parseFloat(targetVal) : null;
      const submitBtn = document.getElementById('submitBtn');

      if (SERPAPI_KEY === 'YOUR_SERPAPI_KEY_HERE') {
        alert('Please paste your SerpApi key into the code first!');
        return;
      }

      submitBtn.innerHTML = `Querying Live NZ Stores...`;
      submitBtn.disabled = true;

      try {
        // We use a CORS proxy or direct endpoint depending on browser limits; SerpApi supports browser fetch via JSONP or direct GET if allowed, or we query via proxy.
        // To ensure 100% reliable browser fetching without CORS blocks, we use AllOrigins proxy wrapper around SerpApi.
        const serpUrl = `https://serpapi.com/search.json?engine=google_shopping&q=${encodeURIComponent(name)}&google_domain=google.co.nz&gl=nz&hl=en&api_key=${SERPAPI_KEY}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(serpUrl)}`;

        const res = await fetch(proxyUrl);
        const data = await res.json();
        const parsed = JSON.parse(data.contents);
        const shoppingResults = parsed.shopping_results || [];

        let storesOnSale = [];
        let productImage = '';

        shoppingResults.slice(0, 6).forEach(offer => {
          if (!productImage && offer.thumbnail) {
            productImage = offer.thumbnail;
          }
          const price = offer.extracted_price;
          const storeName = offer.source;
          const link = offer.link || offer.product_link;

          if (price && storeName && link) {
            if (targetPrice === null || price <= targetPrice) {
              storesOnSale.push({
                name: storeName,
                price: parseFloat(price),
                link: link
              });
            }
          }
        });

        const newItem = {
          name,
          target_price: targetPrice,
          image: productImage,
          storesOnSale: storesOnSale
        };

        items.unshift(newItem);
        saveToStorage();
        closeModal();
      } catch (err) {
        console.error('Live search error:', err);
        alert('Could not fetch live prices. Please check your SerpApi key or connection.');
      } finally {
        submitBtn.innerHTML = `Fetch Live Prices`;
        submitBtn.disabled = false;
      }
    }

    function deleteItem(index) {
      if (confirm('Stop watching this item?')) {
        items.splice(index, 1);
        saveToStorage();
      }
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      const statusFilter = document.getElementById('statusFilter').value;

      document.getElementById('statTotal').innerText = items.length;
      const onSaleCount = items.filter(i => i.storesOnSale && i.storesOnSale.length > 0).length;
      document.getElementById('statOnSale').innerText = onSaleCount;

      const filtered = items.filter((item, index) => {
        item.originalIndex = index;
        const hasSale = item.storesOnSale && item.storesOnSale.length > 0;
        if (statusFilter === 'sale' && !hasSale) return false;
        if (statusFilter === 'tracking' && hasSale) return false;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center bg-ocean-900/30 border border-ocean-800/60 rounded-3xl">
            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mx-auto mb-4">
              <i data-lucide="package-open" class="w-8 h-8"></i>
            </div>
            <h3 class="text-base font-semibold text-white">No items watched yet</h3>
            <p class="text-xs text-slate-400 mt-1">Click "Watch Item" above to scan live NZ stores instantly.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map((item) => {
        const hasSale = item.storesOnSale && item.storesOnSale.length > 0;
        const sortedStores = hasSale ? [...item.storesOnSale].sort((a, b) => a.price - b.price) : [];

        const mediaHtml = item.image 
          ? `<img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-2xl object-contain bg-white p-1.5 border border-ocean-700 shrink-0">`
          : `<div class="w-16 h-16 rounded-2xl bg-ocean-800 border border-ocean-700 flex items-center justify-center text-cyan-400 shrink-0"><i data-lucide="tag" class="w-7 h-7"></i></div>`;

        let salesListHtml = '';
        if (hasSale) {
          salesListHtml = `
            <div class="mt-4 pt-4 border-t border-ocean-800/80 space-y-2">
              <p class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Found at ${sortedStores.length} NZ Store${sortedStores.length > 1 ? 's' : ''}:
              </p>
              <div class="space-y-2">
                ${sortedStores.map((s, idx) => `
                  <div class="flex items-center justify-between bg-ocean-950/70 p-2.5 rounded-xl border ${idx === 0 ? 'border-emerald-500/40' : 'border-ocean-800/80'}">
                    <div class="pr-2">
                      <div class="flex items-center gap-1.5">
                        <span class="text-xs font-semibold text-white">${s.name}</span>
                        ${idx === 0 ? '<span class="text-[9px] font-bold uppercase px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300">Best Price</span>' : ''}
                      </div>
                      <span class="text-sm font-bold text-emerald-400">$${s.price.toFixed(2)} NZD</span>
                    </div>
                    <a href="${s.link}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 bg-emerald-500 hover:bg-emerald-400 text-ocean-950 font-bold px-3 py-2 rounded-lg text-xs shadow-md shadow-emerald-500/20 transition shrink-0">
                      <span>View Store</span>
                      <i data-lucide="external-link" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                    </a>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          salesListHtml = `
            <div class="mt-4 pt-4 border-t border-ocean-800/80">
              <div class="flex items-center justify-between text-xs text-slate-400">
                <span>Status</span>
                <span class="text-amber-400 font-medium">No live stores matched target</span>
              </div>
            </div>
          `;
        }

        return `
          <div class="item-card bg-ocean-900/60 border ${hasSale ? 'border-emerald-500/30' : 'border-ocean-800'} rounded-3xl p-5 shadow-xl flex flex-col justify-between transition" data-name="${item.name}">
            <div>
              <div class="flex items-start space-x-3.5 mb-3">
                ${mediaHtml}
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap mb-1">
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30">NZ Live</span>
                    ${item.target_price ? `<span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-ocean-800 text-cyan-300">Target: $${item.target_price.toFixed(2)}</span>` : ''}
                  </div>
                  <h3 class="font-bold text-white text-base leading-snug break-words">${item.name}</h3>
                </div>
              </div>

              ${salesListHtml}
            </div>

            <div class="mt-4 pt-3 border-t border-ocean-800/50 flex justify-end">
              <button onclick="deleteItem(${item.originalIndex})" class="text-xs text-rose-400 hover:text-rose-300 flex items-center gap-1 transition">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Remove item
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.onload = init;
  </script>
</body>
</html>
