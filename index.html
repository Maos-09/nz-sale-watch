<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Sale Watch</title>
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#06131c">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              950: '#06131c',
              900: '#0b1f2d',
              800: '#132f45',
              700: '#1d4463',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-ocean-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-ocean-950">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-ocean-900/90 backdrop-blur-md border-b border-ocean-700/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-teal-400 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="tag" class="w-6 h-6 text-ocean-950 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            NZ Sale Watch <span class="text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-medium border border-cyan-500/30">Live</span>
          </h1>
          <p class="text-xs text-slate-400">Track items & get notified when they go on sale</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Notification Bell -->
        <div class="relative">
          <button onclick="toggleNotifications()" class="relative p-2 rounded-xl bg-ocean-800/80 hover:bg-ocean-700 text-slate-300 hover:text-white transition border border-ocean-700/50">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="notifBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-cyan-500 text-ocean-950 text-xs font-bold rounded-full flex items-center justify-center shadow-md hidden">0</span>
          </button>

          <!-- Notification Drawer -->
          <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-80 sm:w-96 bg-ocean-900 border border-ocean-700 rounded-2xl shadow-2xl p-4 z-50">
            <div class="flex items-center justify-between pb-3 border-b border-ocean-800">
              <h3 class="font-semibold text-white text-sm flex items-center gap-2">
                <i data-lucide="bell-ring" class="w-4 h-4 text-cyan-400"></i> Sale Alerts
              </h3>
              <button onclick="clearNotifications()" class="text-xs text-slate-400 hover:text-cyan-300 transition">Clear all</button>
            </div>
            <div id="notifList" class="divide-y divide-ocean-800/60 max-h-80 overflow-y-auto mt-2 space-y-2">
              <div class="py-6 text-center text-sm text-slate-400">No sale alerts yet</div>
            </div>
          </div>
        </div>

        <button onclick="openModal()" class="flex items-center space-x-2 bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-ocean-950 font-semibold px-4 py-2 rounded-xl shadow-lg shadow-cyan-500/20 transition transform active:scale-95">
          <i data-lucide="plus" class="w-5 h-5 stroke-[2.5]"></i>
          <span>Track Item</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Stats & Filters Bar -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Tracked Items</p>
          <h3 id="statTotal" class="text-2xl font-bold text-white mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
          <i data-lucide="package" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-medium">Currently on Sale</p>
          <h3 id="statOnSale" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <i data-lucide="tag" class="w-6 h-6"></i>
        </div>
      </div>

      <!-- Filters -->
      <div class="md:col-span-2 bg-ocean-900/60 border border-ocean-800 rounded-2xl p-4 flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400 font-medium">Filter Status:</span>
          <select id="statusFilter" onchange="renderItems()" class="bg-ocean-800 border border-ocean-700 text-xs text-slate-200 rounded-xl px-3 py-2 outline-none focus:border-cyan-500">
            <option value="all">All Statuses</option>
            <option value="sale">On Sale Now</option>
            <option value="tracking">Tracking</option>
          </select>
        </div>

        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400 font-medium">Region:</span>
          <select id="regionFilter" onchange="renderItems()" class="bg-ocean-800 border border-ocean-700 text-xs text-slate-200 rounded-xl px-3 py-2 outline-none focus:border-cyan-500">
            <option value="all">All Regions</option>
            <option value="nz">NZ Only</option>
            <option value="overseas">Overseas</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Items Grid -->
    <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically populated -->
    </div>

  </main>

  <!-- Add/Edit Item Modal -->
  <div id="itemModal" class="hidden fixed inset-0 z-50 bg-ocean-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-ocean-900 border border-ocean-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-ocean-800 mb-6 sticky top-0 bg-ocean-900 z-10">
        <h2 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-cyan-400"></i> Track New Item
        </h2>
        <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white rounded-xl bg-ocean-800/50 hover:bg-ocean-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
        <input type="hidden" id="editIndex" value="-1">

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Item Name <span class="text-cyan-400">*Required</span></label>
          <input type="text" id="itemName" required placeholder="e.g. iPhone 15 Pro, Sony WH-1000XM5" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Category <span class="text-slate-500 font-normal">Optional</span></label>
            <select id="itemCategory" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="Electronics">Electronics</option>
              <option value="Clothing">Clothing & Fashion</option>
              <option value="Home & Living">Home & Living</option>
              <option value="Outdoor">Outdoor & Sports</option>
              <option value="Beauty">Beauty & Health</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Region <span class="text-slate-500 font-normal">Optional</span></label>
            <select id="itemRegion" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
              <option value="nz">New Zealand</option>
              <option value="overseas">Overseas (Converted to NZD)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Baseline RRP <span class="text-slate-500 font-normal">Optional</span></label>
            <input type="number" step="0.01" id="itemBaseline" placeholder="e.g. 1499" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Target Price <span class="text-slate-500 font-normal">Optional</span></label>
            <input type="number" step="0.01" id="itemTarget" placeholder="e.g. 1299" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Item Image URL <span class="text-slate-500 font-normal">Optional</span></label>
          <input type="url" id="itemImage" placeholder="https://example.com/item-photo.jpg" class="w-full bg-ocean-800 border border-ocean-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Stores Offering Sales Setup -->
        <div class="pt-2 border-t border-ocean-800">
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Stores with Sale <span class="text-slate-500 font-normal">Optional</span></label>
            <button type="button" onclick="addStoreRow()" class="text-xs text-cyan-400 hover:underline flex items-center gap-1">+ Add Store Sale</button>
          </div>
          <div id="storeRowsContainer" class="space-y-2 max-h-40 overflow-y-auto pr-1">
            <!-- Dynamically added store rows -->
          </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-ocean-800">
          <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-ocean-800 hover:bg-ocean-700 text-slate-300 text-sm font-semibold transition">Cancel</button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 hover:from-cyan-400 hover:to-teal-300 text-ocean-950 text-sm font-bold shadow-lg shadow-cyan-500/20 transition">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    let items = JSON.parse(localStorage.getItem('nz_sale_watch_items')) || [];
    let notifications = JSON.parse(localStorage.getItem('nz_sale_watch_notifs')) || [];

    const categoryIcons = {
      'Electronics': 'smartphone',
      'Clothing': 'shirt',
      'Home & Living': 'home',
      'Outdoor': 'compass',
      'Beauty': 'sparkles',
      'Other': 'package'
    };

    function init() {
      lucide.createIcons();
      renderItems();
      updateNotificationsUI();
    }

    function saveToStorage() {
      localStorage.setItem('nz_sale_watch_items', JSON.stringify(items));
      localStorage.setItem('nz_sale_watch_notifs', JSON.stringify(notifications));
      renderItems();
      updateNotificationsUI();
    }

    function openModal(editIndex = -1) {
      document.getElementById('itemModal').classList.remove('hidden');
      const container = document.getElementById('storeRowsContainer');
      container.innerHTML = '';

      if (editIndex > -1) {
        document.getElementById('modalTitle').innerHTML = `<i data-lucide="edit-3" class="w-5 h-5 text-cyan-400"></i> Edit Tracked Item`;
        document.getElementById('editIndex').value = editIndex;
        const item = items[editIndex];
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemCategory').value = item.category || 'Electronics';
        document.getElementById('itemRegion').value = item.region || 'nz';
        document.getElementById('itemBaseline').value = item.baselinePrice || '';
        document.getElementById('itemTarget').value = item.targetPrice || '';
        document.getElementById('itemImage').value = item.image || '';

        if (item.storesOnSale && item.storesOnSale.length > 0) {
          item.storesOnSale.forEach(s => addStoreRow(s.name, s.price, s.link));
        }
      } else {
        document.getElementById('modalTitle').innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5 text-cyan-400"></i> Track New Item`;
        document.getElementById('editIndex').value = -1;
        document.getElementById('itemForm').reset();
      }
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function addStoreRow(name = '', price = '', link = '') {
      const container = document.getElementById('storeRowsContainer');
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2 bg-ocean-950/40 p-2 rounded-xl border border-ocean-800';
      div.innerHTML = `
        <input type="text" placeholder="Store Name (e.g. Noel Leeming)" value="${name}" class="store-name-input flex-1 bg-ocean-800 border border-ocean-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500">
        <input type="number" step="0.01" placeholder="Sale Price $" value="${price}" class="store-price-input w-24 bg-ocean-800 border border-ocean-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500">
        <input type="url" placeholder="Specific Product Sale URL" value="${link}" class="store-link-input flex-1 bg-ocean-800 border border-ocean-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500">
        <button type="button" onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      `;
      container.appendChild(div);
      lucide.createIcons();
    }

    function saveItem(e) {
      e.preventDefault();
      const editIndex = parseInt(document.getElementById('editIndex').value);
      const name = document.getElementById('itemName').value;
      const category = document.getElementById('itemCategory').value;
      const region = document.getElementById('itemRegion').value;
      const baselinePrice = parseFloat(document.getElementById('itemBaseline').value) || null;
      const targetPrice = parseFloat(document.getElementById('itemTarget').value) || null;
      const image = document.getElementById('itemImage').value.trim();

      const storeRows = document.querySelectorAll('#storeRowsContainer > div');
      const storesOnSale = [];
      storeRows.forEach(row => {
        const sName = row.querySelector('.store-name-input').value.trim();
        const sPrice = parseFloat(row.querySelector('.store-price-input').value);
        const sLink = row.querySelector('.store-link-input').value.trim();
        if (sName && !isNaN(sPrice)) {
          storesOnSale.push({ name: sName, price: sPrice, link: sLink || '#' });
        }
      });

      const itemData = {
        name,
        category,
        region,
        baselinePrice,
        targetPrice,
        image,
        storesOnSale
      };

      if (editIndex > -1) {
        items[editIndex] = itemData;
        if (storesOnSale.length > 0 && (!items[editIndex].storesOnSale || items[editIndex].storesOnSale.length === 0)) {
          addNotification(name, `"${name}" is now on sale across ${storesOnSale.length} store(s)!`);
        }
      } else {
        items.push(itemData);
        if (storesOnSale.length > 0) {
          addNotification(name, `"${name}" is on sale right now starting at $${Math.min(...storesOnSale.map(s => s.price)).toFixed(2)} NZD!`);
        }
      }

      saveToStorage();
      closeModal();
    }

    function deleteItem(index) {
      if (confirm('Are you sure you want to stop tracking this item?')) {
        items.splice(index, 1);
        saveToStorage();
      }
    }

    function addNotification(itemName, message) {
      notifications.unshift({
        id: Date.now(),
        itemName,
        message,
        time: 'Just now',
        read: false
      });
      if (notifications.length > 20) notifications.pop();
    }

    function toggleNotifications() {
      const dropdown = document.getElementById('notifDropdown');
      dropdown.classList.toggle('hidden');
    }

    function clearNotifications() {
      notifications = [];
      saveToStorage();
    }

    function handleNotificationClick(notifId) {
      const notif = notifications.find(n => n.id === notifId);
      if (notif) {
        notif.read = true;
        saveToStorage();
        toggleNotifications();
        
        const cards = document.querySelectorAll('.item-card');
        cards.forEach(card => {
          if (card.dataset.name === notif.itemName) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('ring-2', 'ring-cyan-400', 'bg-ocean-800/90');
            setTimeout(() => {
              card.classList.remove('ring-2', 'ring-cyan-400', 'bg-ocean-800/90');
            }, 2500);
          }
        });
      }
    }

    function updateNotificationsUI() {
      const badge = document.getElementById('notifBadge');
      const list = document.getElementById('notifList');
      const unreadCount = notifications.filter(n => !n.read).length;

      if (unreadCount > 0) {
        badge.innerText = unreadCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (notifications.length === 0) {
        list.innerHTML = `<div class="py-6 text-center text-sm text-slate-400">No sale alerts yet</div>`;
        return;
      }

      list.innerHTML = notifications.map(n => `
        <div onclick="handleNotificationClick(${n.id})" class="p-3 hover:bg-ocean-800/50 rounded-xl cursor-pointer transition ${n.read ? 'opacity-60' : 'bg-ocean-800/20'}">
          <div class="flex items-start justify-between gap-2">
            <p class="text-xs font-semibold text-white">${n.itemName}</p>
            <span class="text-[10px] text-slate-400">${n.time}</span>
          </div>
          <p class="text-xs text-slate-300 mt-1">${n.message}</p>
        </div>
      `).join('');
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      const statusFilter = document.getElementById('statusFilter').value;
      const regionFilter = document.getElementById('regionFilter').value;

      document.getElementById('statTotal').innerText = items.length;
      const onSaleCount = items.filter(i => i.storesOnSale && i.storesOnSale.length > 0).length;
      document.getElementById('statOnSale').innerText = onSaleCount;

      const filtered = items.filter((item, index) => {
        item.originalIndex = index;
        const hasSale = item.storesOnSale && item.storesOnSale.length > 0;
        if (statusFilter === 'sale' && !hasSale) return false;
        if (statusFilter === 'tracking' && hasSale) return false;
        if (regionFilter === 'nz' && item.region !== 'nz') return false;
        if (regionFilter === 'overseas' && item.region !== 'overseas') return false;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center bg-ocean-900/30 border border-ocean-800/60 rounded-3xl">
            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mx-auto mb-4">
              <i data-lucide="package-open" class="w-8 h-8"></i>
            </div>
            <h3 class="text-base font-semibold text-white">No items found</h3>
            <p class="text-xs text-slate-400 mt-1">Click "Track Item" above to add your first product to watch for sales.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = filtered.map((item) => {
        const hasSale = item.storesOnSale && item.storesOnSale.length > 0;
        const iconName = categoryIcons[item.category] || 'package';

        const mediaHtml = item.image 
          ? `<img src="${item.image}" alt="${item.name}" class="w-14 h-14 rounded-2xl object-cover border border-ocean-700 bg-ocean-800">`
          : `<div class="w-14 h-14 rounded-2xl bg-ocean-800 border border-ocean-700 flex items-center justify-center text-cyan-400"><i data-lucide="${iconName}" class="w-7 h-7"></i></div>`;

        let salesListHtml = '';
        if (hasSale) {
          salesListHtml = `
            <div class="mt-4 pt-4 border-t border-ocean-800/80 space-y-2">
              <p class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="tag" class="w-3.5 h-3.5"></i> On Sale at ${item.storesOnSale.length} Store(s):
              </p>
              <div class="space-y-2">
                ${item.storesOnSale.map(s => `
                  <div class="flex items-center justify-between bg-ocean-950/60 p-2.5 rounded-xl border border-ocean-800/80">
                    <div>
                      <span class="text-xs font-semibold text-white block">${s.name}</span>
                      <span class="text-xs font-bold text-emerald-400">$${s.price.toFixed(2)} NZD</span>
                    </div>
                    <a href="${s.link}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-1.5 bg-emerald-500 hover:bg-emerald-400 text-ocean-950 font-bold px-3 py-1.5 rounded-lg text-xs shadow-md shadow-emerald-500/20 transition">
                      <span>View Sale</span>
                      <i data-lucide="external-link" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                    </a>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          salesListHtml = `
            <div class="mt-4 pt-4 border-t border-ocean-800/80">
              <div class="flex items-center justify-between text-xs text-slate-400">
                <span>Status</span>
                <span class="text-cyan-300 font-medium flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Watching for sales...</span>
              </div>
            </div>
          `;
        }

        const overseasBadge = item.region === 'overseas' 
          ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 flex items-center gap-1"><i data-lucide="globe" class="w-3 h-3"></i> Converted to NZD</span>`
          : '';

        return `
          <div class="item-card bg-ocean-900/60 border border-ocean-800 rounded-3xl p-5 shadow-xl flex flex-col justify-between transition" data-name="${item.name}">
            <div>
              <div class="flex items-start justify-between gap-3 mb-4">
                <div class="flex items-center space-x-3">
                  ${mediaHtml}
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-ocean-800 text-cyan-300 border border-ocean-700/60">${item.category || 'Electronics'}</span>
                      ${overseasBadge}
                    </div>
                    <h3 class="font-bold text-white text-base mt-1 leading-snug">${item.name}</h3>
                  </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-1">
                  <button onclick="openModal(${item.originalIndex})" title="Edit Item" class="p-2 text-slate-400 hover:text-white rounded-xl bg-ocean-800/50 hover:bg-ocean-800 transition">
                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                  </button>
                  <button onclick="deleteItem(${item.originalIndex})" title="Delete Item" class="p-2 text-rose-400 hover:text-rose-300 rounded-xl bg-ocean-800/50 hover:bg-ocean-800 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Meta details -->
              <div class="grid grid-cols-2 gap-2 text-xs bg-ocean-950/40 p-3 rounded-2xl border border-ocean-800/60 mb-2">
                <div>
                  <span class="text-slate-400 block text-[10px]">Baseline RRP</span>
                  <span class="font-medium text-slate-200">${item.baselinePrice ? `$${item.baselinePrice.toFixed(2)} NZD` : 'Not set'}</span>
                </div>
                <div>
                  <span class="text-slate-400 block text-[10px]">Target Price</span>
                  <span class="font-medium text-slate-200">${item.targetPrice ? `$${item.targetPrice.toFixed(2)} NZD` : 'Not set'}</span>
                </div>
              </div>

              ${salesListHtml}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.onload = init;
  </script>
</body>
</html>
